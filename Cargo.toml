[package]
name = "mkfreebsdiso"
version = "0.1.0"
edition = "2024"
authors = ["MTSyntho"]
description = "A simple CLI tool to streamline creation of FreeBSD images without building from source or a mandatory FreeBSD host machine."
license = "MIT"
repository = "https://github.com/mtsyntho/mkfreebsdiso"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dircpy = "0.3.20"
nix = { version = "0.31.3", features = ["user"] }
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
tar = "0.4.46"
tokio = { version = "1.52.3", features = ["full"] }
xz2 = "0.1.7"
